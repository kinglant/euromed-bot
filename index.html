<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euromed Медтест</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#d61f2c;--red2:#a91220;--ink:#1a1820;--muted:#7a7076;--paper:#fffaf9;--g1:#f8dede;--g2:#eebec0;--card:#fff;--ok:#1f9d63}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:var(--paper);
  background-image:linear-gradient(var(--g2) 1px,transparent 1px),linear-gradient(90deg,var(--g2) 1px,transparent 1px),
    linear-gradient(var(--g1) 1px,transparent 1px),linear-gradient(90deg,var(--g1) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px}
.mono{font-family:"JetBrains Mono",monospace}
header{position:sticky;top:0;z-index:5;background:rgba(255,250,249,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--red)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.top img{width:40px;height:40px;border-radius:50%;box-shadow:0 4px 12px rgba(214,31,44,.25)}
.top b{font-size:20px;font-weight:800;color:var(--red);letter-spacing:.5px}
.top small{display:block;font:700 10px "JetBrains Mono";color:var(--muted);letter-spacing:1px}
.lang{margin-left:auto;display:flex;border:1.5px solid var(--red);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;font:700 12px "JetBrains Mono";padding:6px 9px;color:var(--red)}
.lang button.on{background:var(--red);color:#fff}
svg.beat{display:block;width:100%;height:34px}
svg.beat path{fill:none;stroke:var(--red);stroke-width:2.4;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.6s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}
nav{display:flex;gap:4px;padding:0 12px}
nav button{flex:1;border:0;background:none;font:700 12px "JetBrains Mono";letter-spacing:.5px;color:var(--muted);padding:10px 4px;border-radius:10px 10px 0 0}
nav button.on{background:var(--red);color:#fff}
main{padding:16px 16px 40px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:18px;box-shadow:0 10px 30px rgba(120,10,25,.12);overflow:hidden;margin-bottom:14px}
.card .hd{background:var(--red);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font:800 13px "JetBrains Mono";letter-spacing:.5px}
.card .hd span{opacity:.75;font-weight:500}
.card .bd{padding:16px}
h1{font-size:30px;font-weight:800;line-height:1.05;margin:4px 0 10px}
h1 em{font-style:normal;color:var(--red)}
p{color:var(--muted);line-height:1.45;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:2px dashed var(--g1);gap:10px}
.row:last-child{border-bottom:0}
.row .k{font:600 12px "JetBrains Mono";color:var(--muted);text-transform:uppercase}
.row .v{font-weight:700;font-size:16px;text-align:right}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:40px;padding:15px 18px;font:700 16px Rubik;background:var(--red);color:#fff;margin-top:12px;box-shadow:0 8px 20px rgba(214,31,44,.3)}
.btn.ghost{background:#fff;color:var(--red);border:2px solid var(--red);box-shadow:none}
.btn:active{transform:scale(.98)}
.strip{background:#fff;border-radius:14px;padding:6px 10px;margin-bottom:12px;box-shadow:0 4px 14px rgba(120,10,25,.08)}
.strip svg{width:100%;height:46px;display:block}
.strip svg path{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linejoin:round}
.meta{display:flex;justify-content:space-between;font:700 11px "JetBrains Mono";color:var(--muted);padding:2px 2px 0}
.subj{display:inline-block;font:800 11px "JetBrains Mono";color:#fff;background:var(--ink);padding:5px 9px;border-radius:6px;margin-bottom:10px}
.subj.chem{background:#3a3550}.subj.bio{background:var(--red)}
.q{font-size:20px;font-weight:700;line-height:1.3;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--g1);background:#fff;border-radius:14px;padding:13px 14px;font:500 16px Rubik;color:var(--ink);margin-bottom:9px}
.opt i{font:800 13px "JetBrains Mono";font-style:normal;width:28px;height:28px;border-radius:8px;background:var(--g1);color:var(--red);display:grid;place-items:center;flex:none}
.opt.right{border-color:var(--ok);background:#effaf4}.opt.right i{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:#fff1f2}.opt.wrong i{background:var(--red);color:#fff}
.ex{display:none;margin-top:6px;padding:12px 14px;border-left:4px solid var(--red);background:#fff6f6;border-radius:0 12px 12px 0;font-size:14px;line-height:1.4}
.flag{font:800 12px "JetBrains Mono";padding:3px 7px;border-radius:6px;margin-left:8px}
.flag.lo{background:#fff1f2;color:var(--red)}.flag.ok{background:#effaf4;color:var(--ok)}
.bar{height:8px;border-radius:4px;background:var(--g1);margin-top:6px;position:relative;overflow:hidden}
.bar b{position:absolute;inset:0 auto 0 0;background:var(--red);border-radius:4px}
.bar u{position:absolute;top:-2px;bottom:-2px;left:70%;width:2px;background:var(--ink);text-decoration:none}
.course{display:flex;gap:14px;align-items:flex-start}
.course .ic{font-size:30px;width:52px;height:52px;border-radius:14px;background:var(--g1);display:grid;place-items:center;flex:none}
.course h3{font-size:18px}.course .tag{font:700 11px "JetBrains Mono";color:var(--red);margin:3px 0 6px;text-transform:uppercase}
.big{font:800 44px Rubik;color:var(--red);line-height:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stats>div{background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(120,10,25,.08)}
.stats small{font:700 11px "JetBrains Mono";color:var(--muted);text-transform:uppercase}
a{color:var(--red)}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="top">
    <img src="logo.png" alt="">
    <div><b>EUROMED</b><small>STUDY · SINCE 2017</small></div>
    <div class="lang"><button data-l="ru">RU</button><button data-l="uz">UZ</button></div>
  </div>
  <svg class="beat" viewBox="0 0 400 34" preserveAspectRatio="none"><path d="M0 22H60l6-4 6 4h14l4 5 8-24 7 30 5-11h16l8-5 8 5H210l6-4 6 4h14l4 5 8-24 7 30 5-11h16l8-5 8 5H400"/></svg>
  <nav>
    <button data-tab="test"></button><button data-tab="courses"></button><button data-tab="center"></button>
  </nav>
</header>
<main id="app"></main>

<script>
const tg = window.Telegram?.WebApp;
const inTg = () => !!(tg && tg.initData);
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.("#fffaf9"); tg.setBackgroundColor?.("#fffaf9"); }
const params = new URLSearchParams(location.search);
let lang = params.get("lang") === "uz" ? "uz" : (params.get("lang") === "ru" ? "ru" : (tg?.initDataUnsafe?.user?.language_code === "uz" ? "uz" : "ru"));
let tab = ["test", "courses", "center"].includes(params.get("tab")) ? params.get("tab") : "test";
let B = null, st = null;
const $ = (s) => document.querySelector(s);
const L = (o) => (o && typeof o === "object" && !Array.isArray(o)) ? o[lang] : o;
const haptic = (t) => tg?.HapticFeedback?.notificationOccurred?.(t);

const TX = {
  tabs: { ru: ["МЕДТЕСТ", "КУРСЫ", "ЦЕНТР"], uz: ["MEDTEST", "KURSLAR", "MARKAZ"] },
  intro_hd: { ru: "НАПРАВЛЕНИЕ НА АНАЛИЗ", uz: "TAHLILGA YO'LLANMA" },
  intro_h: { ru: "Проверьте свою <em>химию</em> и <em>биологию</em>", uz: "<em>Kimyo</em> va <em>biologiya</em>ingizni tekshiring" },
  intro_p: { ru: "20 вопросов уровня вступительных тестов: 10 по химии, 10 по биологии. После каждого ответа — короткое объяснение. В конце — «лабораторный бланк» с вашим уровнем.",
             uz: "Kirish testlari darajasidagi 20 savol: 10 tasi kimyo, 10 tasi biologiya. Har javobdan keyin — qisqa izoh. Oxirida — darajangiz yozilgan «laboratoriya blanki»." },
  rows: { ru: [["Вопросов", "20"], ["Время", "≈ 5 мин"], ["Предметы", "⚗️ + 🫀"], ["Стоимость", "Бесплатно"]],
          uz: [["Savollar", "20"], ["Vaqt", "≈ 5 daq"], ["Fanlar", "⚗️ + 🫀"], ["Narxi", "Bepul"]] },
  start: { ru: "Начать анализ", uz: "Tahlilni boshlash" },
  chem: { ru: "ХИМИЯ", uz: "KIMYO" }, bio: { ru: "БИОЛОГИЯ", uz: "BIOLOGIYA" },
  next: { ru: "Дальше", uz: "Keyingi" }, finish: { ru: "Получить результат", uz: "Natijani olish" },
  res_hd: { ru: "РЕЗУЛЬТАТ АНАЛИЗА", uz: "TAHLIL NATIJASI" },
  total: { ru: "Итого", uz: "Jami" }, level: { ru: "Уровень", uz: "Daraja" },
  norm: { ru: "Ориентир для медВУЗа — 7 из 10 и выше", uz: "TibbiyOTM uchun mo'ljal — 10 dan 7 va undan yuqori" },
  lo: { ru: "↓ ниже", uz: "↓ past" }, ok: { ru: "✓ норма", uz: "✓ me'yor" },
  rec: { ru: "Рекомендация", uz: "Tavsiya" },
  send: { ru: "🧪 Отправить в бот и записаться на пробное", uz: "🧪 Botga yuborish va sinov darsiga yozilish" },
  again: { ru: "Пройти ещё раз", uz: "Qayta topshirish" },
  trial: { ru: "🧪 Бесплатное пробное занятие", uz: "🧪 Bepul sinov darsi" },
  courses_p: { ru: "Пн – Сб · 15:00–18:00 · занятия на русском языке", uz: "Du – Sha · 15:00–18:00 · darslar rus tilida" },
  students: { ru: "Студентов", uz: "O'quvchilar" }, since: { ru: "С года", uz: "Yildan beri" },
  address: { ru: "Адрес", uz: "Manzil" }, schedule: { ru: "График", uz: "Jadval" }, phone: { ru: "Телефон", uz: "Telefon" },
  map: { ru: "🗺 Открыть карту", uz: "🗺 Xaritani ochish" }, admin: { ru: "💬 Написать администратору", uz: "💬 Administratorga yozish" },
  center_hd: { ru: "КАРТОЧКА ЦЕНТРА", uz: "MARKAZ KARTASI" },
};
const tx = (k) => TX[k][lang];

function send(payload, startParam) {
  payload.lang = lang;
  const viaKeyboard = inTg() && tg.initDataUnsafe && !tg.initDataUnsafe.query_id;
  if (viaKeyboard) { tg.sendData(JSON.stringify(payload)); return; }
  const url = `https://t.me/${B.bot_username}?start=${startParam}_${lang}`;
  if (inTg()) { tg.openTelegramLink(url); setTimeout(() => tg.close(), 300); } else location.href = url;
}

// ---- EKG chizig'i: to'g'ri javob = baland cho'qqi, xato = past "tish"
function stripPath(marks, total) {
  const W = 400, base = 30, step = W / total;
  let d = `M0 ${base}`;
  for (let i = 0; i < total; i++) {
    const x = i * step, m = marks[i];
    if (m === undefined) { d += `H${x + step}`; continue; }
    if (m) d += `H${x + step * .3}l${step * .08} 4l${step * .1} -26l${step * .1} 32l${step * .08} -10H${x + step}`;
    else d += `H${x + step * .35}l${step * .15} 7l${step * .15} -7H${x + step}`;
  }
  return d;
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  document.querySelectorAll("nav button").forEach((b, i) => { b.textContent = TX.tabs[lang][i]; b.classList.toggle("on", b.dataset.tab === tab); });
  const app = $("#app");
  if (tab === "courses") app.innerHTML = coursesView();
  else if (tab === "center") app.innerHTML = centerView();
  else app.innerHTML = !st ? introView() : (st.i < B.test.length ? questionView() : resultView());
  bind();
  window.scrollTo(0, 0);
}

function introView() {
  return `<div class="card"><div class="hd">${tx("intro_hd")}<span>№ ${B.since}</span></div><div class="bd">
    <h1>${tx("intro_h")}</h1><p>${tx("intro_p")}</p>
    <div style="margin-top:10px">${tx("rows").map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}</div>
    <button class="btn" id="start">${tx("start")} →</button></div></div>`;
}

function questionView() {
  const q = B.test[st.i], n = B.test.length, opts = L(q.a), ans = st.ans[st.i];
  return `<div class="strip"><svg viewBox="0 0 400 46" preserveAspectRatio="none"><path d="${stripPath(st.marks, n)}"/></svg>
    <div class="meta"><span>${String(st.i + 1).padStart(2, "0")} / ${n}</span><span>⚗️ ${st.chem} · 🫀 ${st.bio}</span></div></div>
    <div class="card"><div class="bd">
    <span class="subj ${q.s}">${q.s === "chem" ? "⚗️ " + tx("chem") : "🫀 " + tx("bio")}</span>
    <div class="q">${L(q.q)}</div>
    ${opts.map((o, j) => `<button class="opt ${ans === undefined ? "" : (j === q.c ? "right" : (j === ans ? "wrong" : ""))}" data-j="${j}"><i>${"ABCD"[j]}</i>${o}</button>`).join("")}
    <div class="ex" style="${ans === undefined ? "" : "display:block"}">💡 ${L(q.ex)}</div>
    ${ans === undefined ? "" : `<button class="btn" id="next">${st.i === n - 1 ? tx("finish") : tx("next")} →</button>`}
    </div></div>`;
}

function levelOf(s) { return B.levels.find(l => s <= l.max); }

function resultView() {
  const half = B.test.length / 2, s = st.chem + st.bio, lv = levelOf(s);
  let course = lv.course;
  if (Math.abs(st.chem - st.bio) >= 3) course = st.chem < st.bio ? "chem" : "bio";
  const c = B.courses.find(x => x.id === course);
  const line = (name, v) => `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center">
      <span class="k">${name}</span><span class="v mono">${v}/${half}<span class="flag ${v >= 7 ? "ok" : "lo"}">${v >= 7 ? tx("ok") : tx("lo")}</span></span></div>
      <div class="bar"><b style="width:${v / half * 100}%"></b><u></u></div></div>`;
  return `<div class="strip"><svg viewBox="0 0 400 46" preserveAspectRatio="none"><path d="${stripPath(st.marks, B.test.length)}"/></svg></div>
    <div class="card"><div class="hd">${tx("res_hd")}<span>${new Date().toLocaleDateString(lang === "ru" ? "ru-RU" : "uz-UZ")}</span></div><div class="bd">
    ${line("⚗️ " + tx("chem"), st.chem)}${line("🫀 " + tx("bio"), st.bio)}
    <p class="mono" style="font-size:11px;margin:8px 0 4px">▏ ${tx("norm")}</p>
    <div class="row"><span class="k">${tx("total")}</span><span class="big">${s}<small style="font-size:18px;color:var(--muted)">/${B.test.length}</small></span></div>
    <div class="row"><span class="k">${tx("level")}</span><span class="v">${lv[lang]}</span></div>
    <p style="margin-top:10px">${L(lv.note)}</p>
    <div class="row"><span class="k">${tx("rec")}</span><span class="v">${c.icon} ${L(c.name)}</span></div>
    <button class="btn" id="sendres">${tx("send")}</button>
    <button class="btn ghost" id="again">${tx("again")}</button></div></div>`;
}

function coursesView() {
  return `<p class="mono" style="font-size:12px;margin-bottom:12px">// ${tx("courses_p")}</p>` +
    B.courses.map(c => `<div class="card"><div class="bd"><div class="course"><div class="ic">${c.icon}</div><div>
      <h3>${L(c.name)}</h3><div class="tag">${L(c.tag)}</div><p>${L(c.desc)}</p></div></div>
      <button class="btn" data-trial="${c.id}">${tx("trial")}</button></div></div>`).join("");
}

function centerView() {
  return `<div class="stats"><div><small>${tx("students")}</small><div class="big">${B.students}</div></div>
    <div><small>${tx("since")}</small><div class="big">${B.since}</div></div></div>
    <div class="card"><div class="hd">${tx("center_hd")}<span>EUROMED</span></div><div class="bd">
    <p style="margin-bottom:8px">${L(B.about)}</p>
    <div class="row"><span class="k">${tx("address")}</span><span class="v">${L(B.address)}</span></div>
    <div class="row"><span class="k">${tx("schedule")}</span><span class="v">${L(B.schedule)}</span></div>
    <div class="row"><span class="k">${tx("phone")}</span><span class="v"><a href="tel:${B.phone_raw}">${B.phone}</a></span></div>
    <button class="btn" data-url="${B.map}">${tx("map")}</button>
    <button class="btn ghost" data-url="${B.telegram}">${tx("admin")}</button>
    <button class="btn ghost" data-url="${B.instagram}">📸 Instagram</button></div></div>`;
}

function bind() {
  $("#start")?.addEventListener("click", () => { st = { i: 0, ans: [], marks: [], chem: 0, bio: 0 }; render(); });
  document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    if (st.ans[st.i] !== undefined) return;
    const q = B.test[st.i], j = +b.dataset.j, ok = j === q.c;
    st.ans[st.i] = j; st.marks[st.i] = ok;
    if (ok) st[q.s]++;
    haptic(ok ? "success" : "error");
    render();
  }));
  $("#next")?.addEventListener("click", () => { st.i++; render(); });
  $("#again")?.addEventListener("click", () => { st = null; render(); });
  $("#sendres")?.addEventListener("click", () => send({ type: "test", chem: st.chem, bio: st.bio }, `t_${st.chem}_${st.bio}`));
  document.querySelectorAll("[data-trial]").forEach(b => b.addEventListener("click", () => send({ type: "trial", course: b.dataset.trial }, `tr_${b.dataset.trial}`)));
  document.querySelectorAll("[data-url]").forEach(b => b.addEventListener("click", () => {
    const u = b.dataset.url;
    if (inTg()) (u.startsWith("https://t.me/") ? tg.openTelegramLink(u) : tg.openLink(u)); else window.open(u, "_blank");
  }));
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.l; render(); }));
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; render(); }));
fetch("brand.json").then(r => r.json()).then(j => { B = j; render(); });
</script>
</body>
</html>
